services:
  postgres:
    image: postgres:16-alpine
    container_name: acf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: acf
      POSTGRES_PASSWORD: acf
      POSTGRES_DB: acf_dev
    ports:
      - "5432:5432"
    volumes:
      - acf_pg_data:/var/lib/postgresql/data
      - ./database/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acf -d acf_dev"]
      interval: 3s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: acf-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - acf_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  acf_pg_data:
  acf_redis_data:
