# AI Content Factory — SAME_DOMAIN_PATH_BASED
# Replace YOUR_DOMAIN before enable (example: app.example.com).
# Public: 80/443 only. App processes bind 127.0.0.1.
#
# API prefix (verified against code):
#   Nest has NO global prefix. Health is GET /health.
#   Browser uses NEXT_PUBLIC_API_BASE=/api + paths like /auth/login.
#   Public URL /api/health must become Nest /health.
#   location /api/ + proxy_pass http://127.0.0.1:3001/  (trailing slashes strip /api).
#   Nginx handles public /api. Next rewrite remains for loopback:3010 only — not used
#   for Internet traffic (this location is more specific than location /).

upstream acf_frontend {
    server 127.0.0.1:3010;
    keepalive 8;
}

upstream acf_backend {
    server 127.0.0.1:3001;
    keepalive 16;
}

# --- HTTP: ACME + redirect (after certificates exist, keep ACME location) ---
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    client_max_body_size 128m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Before first certificate: comment the next location and temporarily proxy
    # location / { proxy_pass http://acf_frontend; } for HTTP-only bring-up.
    # After certificate: keep this redirect.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 128m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: deferred (Next.js). Do not enable unverified CSP on first commercial RC.

    location = /api {
        return 301 /api/;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
        proxy_pass http://acf_backend/;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass http://acf_frontend;
    }
}
